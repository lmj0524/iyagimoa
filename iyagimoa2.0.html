<main><section class="hero"><h1>오늘의 이야기를 모아요 ✨</h1><p>소소한 일상부터 궁금한 이야기까지, 자유롭게 나눠보세요.</p></section><div id="adminPanel" class="adminpanel"><strong>관리자 모드</strong><div id="adminStatus">관리자 모드가 꺼져 있습니다.</div><p class="adminnote">관리자 비밀번호는 아래 코드의 ADMIN_PIN 값을 변경하세요. 이 HTML 방식은 보안용 관리자 인증이 아니라 간단한 화면 잠금입니다.</p><button class="secondary" id="adminExit" style="margin-top:10px">관리자 모드 끄기</button></div><div class="toolbar"><input id="search" placeholder="게시글 검색 (제목·내용)"><button class="primary" id="writeBtn">＋ 글쓰기</button></div><section class="board"><div class="boardhead"><span>자유게시판</span><span id="count">게시글 0개</span></div><div id="list"></div></section><div class="foot">이야기모아 · 서로 존중하며 이야기해요<br><span id="saveMode">저장 방식 확인 중…</span></div></main>
<div class="modalback" id="writeModal"><div class="modal"><h2>새 글 작성</h2><div class="form"><input id="author" maxlength="30" placeholder="작성자"><input id="title" maxlength="100" placeholder="제목"><textarea id="body" maxlength="10000" placeholder="내용을 입력하세요"></textarea></div><div class="actions"><button class="secondary" onclick="closeModal('writeModal')">취소</button><button class="primary" id="submitPost">등록하기</button></div></div></div>
<div class="modalback" id="detailModal"><div class="modal"><div class="actions" style="margin:0 0 12px"><button class="secondary" onclick="closeModal('detailModal')">닫기</button><button class="deletebtn" id="deletePostBtn" style="display:none">게시글 삭제</button></div><h2 id="dtitle"></h2><div class="detailmeta" id="dmeta"></div><div class="content" id="dcontent"></div><div class="comments"><h3>댓글</h3><div id="commentList"></div><div class="form" style="margin-top:12px"><input id="cAuthor" maxlength="30" placeholder="댓글 작성자"><input id="cText" maxlength="1000" placeholder="댓글 내용"></div><div class="actions"><button class="primary" id="sendComment">댓글 등록</button></div></div></div></div>
<script>
// 영구 저장은 Supabase 설정 후 사용. 아래 URL/키를 프로젝트 값으로 채워주세요.
const SUPABASE_URL='https://uafwovlxokxyehxeciyr.supabase.co'; const SUPABASE_ANON_KEY='sb_publishable_-Bmv7Z_-z43wabCkCWUKWg_Vx7az4QA';
// 관리자 비밀번호를 원하는 값으로 바꾸세요 (예: 'moa2468'). 브라우저 HTML에 저장되므로 실제 보안 인증은 아닙니다.
const ADMIN_PIN='1234'; let adminMode=false; let db=null,posts=[],currentPost=null;
const $=id=>document.getElementById(id); const dateText=d=>new Date(d).toLocaleString('ko-KR');
function closeModal(id){$(id).style.display='none'}function openModal(id){$(id).style.display='flex'}
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function localLoad(){posts=JSON.parse(localStorage.getItem('iyagimoa_posts')||'[]')}function localSave(){localStorage.setItem('iyagimoa_posts',JSON.stringify(posts))}
async function init(){if(SUPABASE_URL.startsWith('https://')&&SUPABASE_ANON_KEY!=='YOUR_SUPABASE_ANON_KEY'){try{let lib=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');db=lib.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let r=await db.from('posts').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;posts=r.data||[];$('saveMode').textContent='온라인 데이터베이스 저장 사용 중'}catch(e){console.error(e);alert('온라인 저장 연결에 실패해 브라우저 저장 모드로 열립니다.');localLoad();$('saveMode').textContent='브라우저 저장 모드 (이 기기에서만 보임)'}}else{localLoad();$('saveMode').textContent='브라우저 저장 모드 (Supabase 설정 전)'}render()}
function render(){let q=$('search').value.trim().toLowerCase(),arr=posts.filter(p=>(p.title+' '+p.content).toLowerCase().includes(q));$('count').textContent=`게시글 ${arr.length}개`;$('list').innerHTML=arr.length?arr.map((p,i)=>`<div class="row" onclick="showPost('${p.id}')"><div class="num">${arr.length-i}</div><div class="posttitle">${esc(p.title)}</div><div class="meta">${esc(p.author||'익명')} · ${dateText(p.created_at)}</div>${adminMode?`<button class="deletebtn" onclick="event.stopPropagation();adminDeletePost('${p.id}')">삭제</button>`:''}</div>`).join(''):'<div class="empty">게시글이 아직 없어요.<br>첫 이야기를 남겨보세요!</div>'}
$('writeBtn').onclick=()=>openModal('writeModal');$('search').oninput=render;
$('adminBtn').onclick=()=>{if(adminMode){adminMode=false;adminUI();return}const pin=prompt('관리자 비밀번호를 입력하세요.');if(pin===ADMIN_PIN){adminMode=true;adminUI()}else if(pin!==null)alert('비밀번호가 틀렸습니다.')};
$('adminExit').onclick=()=>{adminMode=false;adminUI()};
function adminUI(){$('adminPanel').classList.toggle('active',adminMode);$('adminStatus').textContent=adminMode?'관리자 모드 활성화 — 게시글 삭제 버튼이 표시됩니다.':'관리자 모드가 꺼져 있습니다.';render();if(currentPost&&$('detailModal').style.display==='flex')showPost(currentPost.id)}
window.adminDeletePost=async id=>{if(!adminMode)return;if(!confirm('이 게시글을 삭제할까요? 댓글도 함께 삭제됩니다.'))return;if(db){alert('온라인 데이터베이스에서는 보안 관리자 인증을 연결하기 전 삭제가 비활성화되어 있습니다. Supabase Auth 기반 관리자 인증이 필요합니다.');return}posts=posts.filter(p=>String(p.id)!==String(id));localSave();render();if(currentPost&&String(currentPost.id)===String(id))closeModal('detailModal')};
$('deletePostBtn').onclick=()=>currentPost&&adminDeletePost(currentPost.id);
$('submitPost').onclick=async()=>{let author=$('author').value.trim()||'익명',title=$('title').value.trim(),content=$('body').value.trim();if(!title||!content){alert('제목과 내용을 입력해주세요.');return}let p={author,title,content,created_at:new Date().toISOString()};if(db){let r=await db.from('posts').insert({author,title,content}).select().single();if(r.error){alert('저장 오류: '+r.error.message);return}p=r.data}else{p.id=crypto.randomUUID();posts.unshift(p);localSave()}if(db)posts.unshift(p);$('author').value=$('title').value=$('body').value='';closeModal('writeModal');render()};
window.showPost=async id=>{currentPost=posts.find(p=>String(p.id)===String(id));if(!currentPost)return;$('dtitle').textContent=currentPost.title;$('dmeta').textContent=(currentPost.author||'익명')+' · '+dateText(currentPost.created_at);$('dcontent').textContent=currentPost.content;$('deletePostBtn').style.display=adminMode?'inline-block':'none';await loadComments(id);openModal('detailModal')};
async function loadComments(postId){let arr=currentPost.comments||[];if(db){let r=await db.from('comments').select('*').eq('post_id',postId).order('created_at',{ascending:true});if(r.error){$('commentList').textContent='댓글을 불러오지 못했습니다.';return}arr=r.data||[]} $('commentList').innerHTML=arr.length?arr.map(c=>`<div class="commentrow"><div class="comment">${esc(c.content)}<br><small>${esc(c.author||'익명')} · ${dateText(c.created_at)}</small></div>${adminMode&&!db?`<button class="deletebtn" onclick="adminDeleteComment('${c.id}')">삭제</button>`:''}</div>`).join(''):'<div class="empty" style="padding:12px">댓글이 없습니다.</div>'}
window.adminDeleteComment=id=>{if(!adminMode||db)return;if(!confirm('댓글을 삭제할까요?'))return;currentPost.comments=(currentPost.comments||[]).filter(c=>String(c.id)!==String(id));localSave();loadComments(currentPost.id)};
$('sendComment').onclick=async()=>{let author=$('cAuthor').value.trim()||'익명',content=$('cText').value.trim();if(!content){alert('댓글 내용을 입력해주세요.');return}let c={post_id:currentPost.id,author,content,created_at:new Date().toISOString()};if(db){let r=await db.from('comments').insert({post_id:currentPost.id,author,content});if(r.error){alert('댓글 저장 오류: '+r.error.message);return}}else{currentPost.comments=currentPost.comments||[];currentPost.comments.push(c);localSave()}$('cText').value='';loadComments(currentPost.id)};
init();
</script></body></html>
